apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devsecops
  labels:
    app: backend
  annotations:
    checkov.io/skip1: CKV_K8S_43=Local Kind environment; production will use a registry-backed immutable image digest
    checkov.io/skip2: CKV_K8S_15=Local Kind environment; production will use a registry-backed image with Always pull policy

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend-sa
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: dockerized-spring-react-mysql-backend:1.0.2
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: db-secrets
              mountPath: /run/secrets
              readOnly: true

          ports:
            - containerPort: 8080
              protocol: TCP

          startupProbe:
            httpGet:
              path: /api/user
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/user
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/user
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/dockerized?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"

            - name: DB_HOST
              value: "mysql:3306"

            - name: DB_DATABASE
              value: "dockerized"

      volumes:
        - name: tmp
          emptyDir: {}

        - name: db-secrets
          secret:
            secretName: mysql-secret
            items:
              - key: MYSQL_USER
                path: db_user

              - key: MYSQL_PASSWORD
                path: db_password

