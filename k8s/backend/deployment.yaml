apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devsecops
  labels:
    app: backend
  annotations:
    checkov.io/skip1: CKV_K8S_43=Local Kind environment; production will use a registry-backed immutable image digest
    checkov.io/skip2: CKV_K8S_15=Local Kind environment; production will use a registry-backed image with Always pull policy

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "devsecops-backend"
        vault.hashicorp.com/agent-inject-secret-db_user: "secret/data/devsecops/backend"
        vault.hashicorp.com/agent-inject-template-db_user: '{{- with secret "secret/data/devsecops/backend" -}}{{ .Data.data.username }}{{- end }}'
        vault.hashicorp.com/agent-inject-secret-db_password: "secret/data/devsecops/backend" # checkov:skip=CKV_SECRET_6:Vault secret path, not a secret value
        vault.hashicorp.com/agent-inject-template-db_password: '{{- with secret "secret/data/devsecops/backend" -}}{{ .Data.data.password }}{{- end }}'
        vault.hashicorp.com/secret-volume-path: "/run/secrets"
        vault.hashicorp.com/agent-run-as-user: "10001"
        vault.hashicorp.com/agent-run-as-group: "10001"
        vault.hashicorp.com/agent-run-as-non-root: "true"
        vault.hashicorp.com/agent-run-as-same-user: "true"

    spec:
      serviceAccountName: backend-sa
      automountServiceAccountToken: true # checkov:skip=CKV_K8S_38:Required for Vault Kubernetes authentication using backend-sa

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: ghcr.io/alwin777-ops/devsecops-zero-trust-platform/backend@sha256:03ecba6d3327f4db7d758449d3f76d6a3b4b88acb69e48ef974f167929e40af4
          imagePullPolicy: Always

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          ports:
            - containerPort: 8080
              protocol: TCP

          startupProbe:
            httpGet:
              path: /api/user
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /api/user
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/user
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/dockerized?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"

            - name: DB_HOST
              value: "mysql:3306"

            - name: DB_DATABASE
              value: "dockerized"

      volumes:
        - name: tmp
          emptyDir: {}



