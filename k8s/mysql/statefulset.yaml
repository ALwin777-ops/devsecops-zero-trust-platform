apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: devsecops
  annotations:
    checkov.io/skip1: CKV_K8S_43=Local Kind environment; production will use a registry-backed image digest
    checkov.io/skip2: CKV_K8S_15=Local Kind environment; Always pull requires a registry-backed image workflow
    checkov.io/skip3: CKV_K8S_35=Official MySQL image consumes MYSQL_ROOT_PASSWORD MYSQL_USER and MYSQL_PASSWORD through environment variables
    checkov.io/skip4: CKV_K8S_40=Official MySQL image requires its supported runtime UID behavior
    checkov.io/skip5: CKV_K8S_23=Official MySQL image initialization requires its supported root startup behavior
    checkov.io/skip6: CKV_K8S_37=Official MySQL image requires additional Linux capabilities during initialization; NET_RAW is already dropped
    checkov.io/skip7: CKV_K8S_22=MySQL requires a writable filesystem for initialization and runtime; database persistence is restricted to the dedicated PVC
spec:
  serviceName: mysql
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      serviceAccountName: mysql-sa
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault


      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          securityContext:
            seccompProfile:
             type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW

          ports:
            - containerPort: 3306
              protocol: TCP

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

            - name: MYSQL_DATABASE
              value: "dockerized"

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" --silent
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
