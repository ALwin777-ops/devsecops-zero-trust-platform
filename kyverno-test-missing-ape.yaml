apiVersion: v1
kind: Pod
metadata:
  name: kyverno-test-missing-ape
  namespace: devsecops
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: test
      image: nginxinc/nginx-unprivileged:alpine

      securityContext:
        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"