name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
      - security/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov
        run: |
          checkov -d . --quiet \
            --skip-framework terraform_plan \
            --skip-path kyverno-test.yaml \
            --skip-path kyverno-test-allow.yaml \
            --skip-path kyverno-test-missing-ape.yaml \
            --skip-path kyverno-test-secure.yaml \
            --skip-path monitoring-rendered.yaml
            --skip-path monitoring-rendered.yaml