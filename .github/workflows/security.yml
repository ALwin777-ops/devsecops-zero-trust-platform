name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  checkov:
    name: IaC Security Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./k8s
          framework: kubernetes
          quiet: false


  frontend-security:
    name: Frontend Dependency Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run npm audit
        working-directory: ./frontend
        run: npm audit --audit-level=high


  trivy-filesystem:
    name: Filesystem Vulnerability Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve Maven dependencies
        working-directory: ./backend
        run: mvn dependency:resolve

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'


  docker-build:
    name: Build Backend Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t devsecops-backend:${{ github.sha }} \
            ./backend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-backend:${{ github.sha }}
          format: cyclonedx
          output: backend-sbom.json
          scan-type: image

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.json

      - name: Save scanned backend image
        run: |
          docker save devsecops-backend:${{ github.sha }} | gzip > backend-image.tar.gz

      - name: Upload scanned backend image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar.gz
          retention-days: 1


  frontend-docker-build:
    name: Build Frontend Image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_BACKEND_HOST=http://backend:8080 \
            -t devsecops-frontend:${{ github.sha }} \
            ./frontend

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-frontend:${{ github.sha }}
          format: cyclonedx
          output: frontend-sbom.json
          scan-type: image

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: frontend-sbom.json

      - name: Save scanned frontend image
        run: |
          docker save devsecops-frontend:${{ github.sha }} | gzip > frontend-image.tar.gz

      - name: Upload scanned frontend image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar.gz
          retention-days: 1


  publish-backend:
    name: Publish Backend Image
    runs-on: ubuntu-24.04

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - gitleaks
      - checkov
      - frontend-security
      - trivy-filesystem
      - docker-build
      - frontend-docker-build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: ./backend-image

      - name: Load scanned backend image
        run: |
          gunzip -c ./backend-image/backend-image.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag scanned backend image
        run: |
          docker tag \
            devsecops-backend:${{ github.sha }} \
            ghcr.io/alwin777-ops/devsecops-zero-trust-platform/backend:${{ github.sha }}

      - name: Push scanned backend image
        run: |
          docker push \
            ghcr.io/alwin777-ops/devsecops-zero-trust-platform/backend:${{ github.sha }}


  publish-frontend:
    name: Publish Frontend Image
    runs-on: ubuntu-24.04

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - gitleaks
      - checkov
      - frontend-security
      - trivy-filesystem
      - docker-build
      - frontend-docker-build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: ./frontend-image

      - name: Load scanned frontend image
        run: |
          gunzip -c ./frontend-image/frontend-image.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag scanned frontend image
        run: |
          docker tag \
            devsecops-frontend:${{ github.sha }} \
            ghcr.io/alwin777-ops/devsecops-zero-trust-platform/frontend:${{ github.sha }}

      - name: Push scanned frontend image
        run: |
          docker push \
            ghcr.io/alwin777-ops/devsecops-zero-trust-platform/frontend:${{ github.sha }}
            