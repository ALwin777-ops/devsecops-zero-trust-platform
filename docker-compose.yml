services:
  mysql:
    image: mysql:8.4
    container_name: dockerized_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - type: volume
        source: mysql-data
        target: /var/lib/mysql
    networks:
      - backend-net
    # Port 3307 removed to prevent external database exposure
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    depends_on:
      mysql:
        condition: service_healthy
    container_name: dockerized_backend
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    security_opt:
        - no-new-privileges:true
    cap_drop:
        - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - DB_HOST=mysql:3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_DATABASE=${MYSQL_DATABASE}
    networks:
      - backend-net
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M

  frontend:
    depends_on:
      - backend
    container_name: dockerized_frontend
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_HOST=${VITE_BACKEND_HOST}
    ports:
      - "80:80"
    networks:
      - frontend-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

volumes:
  mysql-data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # Network tier isolation